# PIPELINE DEFINITION
# Name: training-pipeline
# Inputs:
#    max_depth: int [Default: 2.0]
#    n_estimators: int [Default: 100.0]
#    random_state: int [Default: 0.0]
components:
  comp-ingest-data:
    executorLabel: exec-ingest-data
    outputDefinitions:
      artifacts:
        X_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-show-metrics:
    executorLabel: exec-show-metrics
    inputDefinitions:
      artifacts:
        X_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-split-data:
    executorLabel: exec-split-data
    inputDefinitions:
      artifacts:
        X_in:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_in:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        test_size:
          defaultValue: 0.2
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        X_test_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        X_train_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_test_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_train_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train:
    executorLabel: exec-train
    inputDefinitions:
      artifacts:
        X_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_depth:
          parameterType: NUMBER_INTEGER
        n_estimators:
          parameterType: NUMBER_INTEGER
        random_state:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-ingest-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \ 'numpy==1.26.4'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_data(X_out: Output[Dataset], y_out: Output[Dataset]):\n\
          \    # Ejemplo: guardar cada artifact como un fichero usando el patron recomendado\
          \ en KFP 2.x.\n    from sklearn.datasets import load_iris\n    import numpy\
          \ as np\n\n    X_out.path += \".npy\"\n    y_out.path += \".npy\"\n\n  \
          \  iris = load_iris()\n    np.save(X_out.path, iris.data)\n    np.save(y_out.path,\
          \ iris.target)\n\n"
        image: python:3.11-slim
    exec-show-metrics:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - show_metrics
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \ 'numpy==1.26.4'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef show_metrics(\n    model: Input[Model],\n    X_test: Input[Dataset],\n\
          \    y_test: Input[Dataset],\n    metrics: Output[Metrics],\n):\n    from\
          \ sklearn.metrics import accuracy_score, f1_score\n    import pickle, numpy\
          \ as np\n\n    X = np.load(X_test.path)\n    y = np.load(y_test.path)\n\n\
          \    with open(model.path, \"rb\") as f:\n        clf = pickle.load(f)\n\
          \n    y_pred = clf.predict(X)\n    metrics.log_metric(\"accuracy\", accuracy_score(y,\
          \ y_pred))\n    metrics.log_metric(\"f1_macro\", f1_score(y, y_pred, average=\"\
          macro\"))\n\n"
        image: python:3.11-slim
    exec-split-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - split_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \ 'numpy==1.26.4'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef split_data(\n    X_in: Input[Dataset],\n    y_in: Input[Dataset],\n\
          \    X_train_out: Output[Dataset],\n    X_test_out: Output[Dataset],\n \
          \   y_train_out: Output[Dataset],\n    y_test_out: Output[Dataset],\n  \
          \  test_size: float = 0.2\n):\n    from sklearn.model_selection import train_test_split\n\
          \    import numpy as np\n\n    X = np.load(X_in.path)\n    y = np.load(y_in.path)\n\
          \n    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=test_size,\
          \ random_state=0)\n\n    X_train_out.path += \".npy\"\n    X_test_out.path\
          \ += \".npy\"\n    y_train_out.path += \".npy\"\n    y_test_out.path +=\
          \ \".npy\"\n\n    np.save(X_train_out.path, X_train)\n    np.save(X_test_out.path,\
          \ X_test)\n    np.save(y_train_out.path, y_train)\n    np.save(y_test_out.path,\
          \ y_test)\n\n"
        image: python:3.11-slim
    exec-train:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \ 'numpy==1.26.4'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train(\n    X_train: Input[Dataset],\n    y_train: Input[Dataset],\n\
          \    model_out: Output[Model],\n    max_depth: int,\n    n_estimators: int,\n\
          \    random_state: int,\n):\n    from sklearn.ensemble import RandomForestClassifier\n\
          \    import pickle, numpy as np\n\n    X = np.load(X_train.path)\n    y\
          \ = np.load(y_train.path)\n\n    clf = RandomForestClassifier(max_depth=max_depth,\
          \ n_estimators=n_estimators, random_state=random_state)\n    clf.fit(X,\
          \ y)\n\n    model_out.path += \".pkl\"\n    with open(model_out.path, \"\
          wb\") as f:\n        pickle.dump(clf, f)\n\n"
        image: python:3.11-slim
pipelineInfo:
  name: training-pipeline
root:
  dag:
    tasks:
      ingest-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-data
        taskInfo:
          name: ingest-data
      show-metrics:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-show-metrics
        dependentTasks:
        - split-data
        - train
        inputs:
          artifacts:
            X_test:
              taskOutputArtifact:
                outputArtifactKey: X_test_out
                producerTask: split-data
            model:
              taskOutputArtifact:
                outputArtifactKey: model_out
                producerTask: train
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test_out
                producerTask: split-data
        taskInfo:
          name: show-metrics
      split-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-split-data
        dependentTasks:
        - ingest-data
        inputs:
          artifacts:
            X_in:
              taskOutputArtifact:
                outputArtifactKey: X_out
                producerTask: ingest-data
            y_in:
              taskOutputArtifact:
                outputArtifactKey: y_out
                producerTask: ingest-data
        taskInfo:
          name: split-data
      train:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train
        dependentTasks:
        - split-data
        inputs:
          artifacts:
            X_train:
              taskOutputArtifact:
                outputArtifactKey: X_train_out
                producerTask: split-data
            y_train:
              taskOutputArtifact:
                outputArtifactKey: y_train_out
                producerTask: split-data
          parameters:
            max_depth:
              componentInputParameter: max_depth
            n_estimators:
              componentInputParameter: n_estimators
            random_state:
              componentInputParameter: random_state
        taskInfo:
          name: train
  inputDefinitions:
    parameters:
      max_depth:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      n_estimators:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      random_state:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
